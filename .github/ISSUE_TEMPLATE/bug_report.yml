name: Bug report
description: Report a reproducible FaceLink defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve FaceLink. Do not include API keys, bridge tokens, private assets, or unlicensed `.blend` files.
  - type: input
    id: facelink-version
    attributes:
      label: FaceLink version
      placeholder: 0.3.6
    validations:
      required: true
  - type: dropdown
    id: blender-version
    attributes:
      label: Blender version
      options:
        - 4.2 LTS
        - 4.5 LTS
        - 5.x
        - Other
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or startup
        - Blender bridge
        - MCP server
        - Scene planning or validation
        - Animation or NLA
        - Rig retargeting or pose bake
        - Navigation
        - Camera preflight
        - Undo or rollback
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Start Blender with...
        2. Start the FaceLink bridge...
        3. Run...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and safe logs
      description: Redact usernames, local paths, keys, tokens and private asset names.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I removed credentials, bridge tokens and private assets from this report.
          required: true
