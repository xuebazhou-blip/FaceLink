[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "facelink"
version = "0.1.0"
description = "A safe natural-language control plane for editable Blender previs and animation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "FaceLink Contributors" }]
keywords = ["blender", "mcp", "animation", "previsualization", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.12,<3",
  "openai>=1.50,<3",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.120,<7",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
facelink = "facelink.cli:main"
facelink-mcp = "facelink.mcp_server:main"

[project.urls]
Homepage = "https://github.com/your-name/FaceLink"
Issues = "https://github.com/your-name/FaceLink/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/facelink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["facelink"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
